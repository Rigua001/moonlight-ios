name: Build sideload IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Remove App Store restriction
        run: |
          grep -c ENABLE_APP_STORE_RESTRICTIONS Moonlight.xcodeproj/project.pbxproj
          sed -i '' '/ENABLE_APP_STORE_RESTRICTIONS,/d' Moonlight.xcodeproj/project.pbxproj
          if grep -q ENABLE_APP_STORE_RESTRICTIONS Moonlight.xcodeproj/project.pbxproj; then
            echo "Define still present"; exit 1
          fi

      - name: Build unsigned Release
        run: |
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Moonlight-sideload.ipa Payload
          ls -lh Moonlight-sideload.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-sideload-ipa
          path: Moonlight-sideload.ipa
          if-no-files-found: error
